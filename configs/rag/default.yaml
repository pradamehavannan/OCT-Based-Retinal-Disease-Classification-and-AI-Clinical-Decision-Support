# Part 2 — RAG narrator. Narrative generation only; never touches the decision.
# Corpus is knowledge_base/ at the repo root.

embed:
  model: BAAI/bge-small-en-v1.5      # 384-d, CPU-fine
  rebuild_index: false               # force re-embed even if the cache is fresh

retrieve:
  k_semantic: 4                       # semantic hits added on top of the deterministic set

llm:
  backend: hf_local                  # stub | hf_local | anthropic
  model: Qwen/Qwen2.5-3B-Instruct
  device: null                       # null -> cuda if available else cpu
  dtype: auto
  api_key_env: ANTHROPIC_API_KEY     # used only when backend=anthropic
  max_tokens: 400
  temperature: 0.0                   # deterministic

verify:
  strict: true                       # any contradiction flag -> Part 1 fallback

cache:
  enabled: true                      # knowledge_base/.cache/ (git-ignored)
